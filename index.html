<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1a14" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Judges' Panel · Buglasan Festival 2026</title>

    <!--
      Favicon: cut from the real gold wordmark, not redrawn.

      `buglasan-festival-2026-logo-gold.webp` — the same asset the panel
      header uses — composited onto the app's `--ground` as a rounded tile.

      TWO different crops, on purpose. The full wordmark is 1.9:1, so squeezed
      into a 16px square it is illegible mush (measured: the letterforms
      dissolve entirely). The tab icons therefore carry the script "B" alone,
      which still reads at 16px, while the home-screen icon has room for the
      whole mark. Same artwork, cropped for the space available.

      The tile matters: browser tab chrome is light in some themes, and gold
      on transparent disappears against it.
    -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
